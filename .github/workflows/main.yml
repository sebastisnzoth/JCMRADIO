name: Generar AAB Firmado
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos al constructor (Soluciona Exit Code 1)
        run: chmod +x gradlew

      - name: Decodificar Keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/jcmradio.jks

      - name: Construir Bundle (.aab)
        run: ./gradlew bundleRelease
        env:
          # Estas variables deben coincidir con tus Secretos en GitHub
          RELEASE_STORE_FILE: jcmradio.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
