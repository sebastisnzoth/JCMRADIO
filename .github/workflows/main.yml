name: Generar AAB Firmado

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permisos al motor de Gradle
        # Entramos a la carpeta android para dar permisos al archivo que subiste
        run: chmod +x android/gradlew

      - name: Decodificar Keystore
        # Colocamos tu llave jcmradio.jks dentro de la carpeta android
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/jcmradio.jks

      - name: Construir Bundle (.aab)
        # Entramos a la carpeta 'android' antes de ejecutar el comando
        run: |
          cd android
          ./gradlew bundleRelease
        env:
          RELEASE_STORE_FILE: jcmradio.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Subir Archivo Final
        uses: actions/upload-artifact@v4
        with:
          name: app-release-final
          path: "android/app/build/outputs/bundle/release/*.aab"
