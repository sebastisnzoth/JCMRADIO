name: Generar AAB Firmado
on:
  workflow_dispatch: 

env:
  # Esto elimina la advertencia de Node.js 20
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Permisos de ejecucion
        run: chmod +x gradlew

      - name: Decodificar Keystore
        # Colocamos la llave en la raiz para evitar errores de ruta
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > jcmradio.jks

      - name: Construir con Gradle
        run: ./gradlew bundleRelease
        env:
          RELEASE_STORE_FILE: ../jcmradio.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Subir Resultado
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/bundle/release/*.aab
