name: Generar AAB Firmado

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Localizar gradlew y preparar entorno
        run: |
          # Busca el archivo gradlew en cualquier subcarpeta
          GRADLEW_PATH=$(find . -name "gradlew" -not -path "*/.*" | head -n 1)
          
          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: No se encontro el archivo 'gradlew'. Revisa que no tenga extension .txt"
            exit 1
          fi
          
          # Dar permisos de ejecucion
          chmod +x "$GRADLEW_PATH"
          
          # Guardar la ruta de la carpeta para el siguiente paso
          echo "PROJECT_ROOT=$(dirname "$GRADLEW_PATH")" >> $GITHUB_ENV
          echo "Usando proyecto en: $(dirname "$GRADLEW_PATH")"

      - name: Decodificar Keystore
        # Colocamos la llave jcmradio.jks directamente donde esta el archivo gradlew
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > "${{ env.PROJECT_ROOT }}/jcmradio.jks"

      - name: Construir con Gradle
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          ./gradlew bundleRelease
        env:
          RELEASE_STORE_FILE: jcmradio.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Subir Resultado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-final
          path: "**/*.aab"
